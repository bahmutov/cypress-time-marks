name: ci
on: push
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v7

      - name: Set node version
        # https://github.com/actions/setup-node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Run Cypress tests 🧪
        # https://github.com/cypress-io/github-action
        uses: cypress-io/github-action@v7
        with:
          build: npm run stop-only && npm run lint

  release:
    needs: test
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    permissions:
      # allow the release step to comment on
      # issues, pull requests, and write to the repo
      contents: write
      issues: write
      pull-requests: write
      # Required for OIDC to let NPM registry know
      # that this workflow is trusted
      id-token: write
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v7

      - name: Install only the semantic release 📦
        run: npm install semantic-release

      - name: Semantic Release 🚀
        uses: cycjimmy/semantic-release-action@v4
        with:
          branch: main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
